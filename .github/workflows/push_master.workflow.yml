name: Push checks

on:
  push:
    branches:
      - master

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.workflow.yml

  # Manual publication with a token, kept as is until ADR-0001 step 03 moves
  # releases to semantic-release with npm OIDC trusted publishing.
  npm-deploy:
    name: Publish Package to NPM.js
    runs-on: ubuntu-24.04
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
